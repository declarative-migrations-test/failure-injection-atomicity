name: tmp format crash evidence validator

on:
  push:
    branches:
      - den-3430-rust-crash-evidence-validator

permissions:
  contents: write

concurrency:
  group: tmp-format-crash-evidence-validator
  cancel-in-progress: false

jobs:
  format-and-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: den-3430-rust-crash-evidence-validator
          fetch-depth: 0

      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt

      - name: Format validator and verify
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.90.0 fmt --manifest-path tools/crash-evidence-validator/Cargo.toml
          cargo +1.90.0 fmt --manifest-path tools/crash-evidence-validator/Cargo.toml -- --check
          git diff --check
          test -n "$(git diff -- tools/crash-evidence-validator/src/main.rs)"

      - name: Commit formatted source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware automation'
          git config user.email 'automation@users.noreply.github.com'
          git rm .github/workflows/tmp-format-crash-validator.yml
          git add tools/crash-evidence-validator/src/main.rs
          git commit -m 'style: format crash evidence validator with Rust 1.90'
          git push origin HEAD:den-3430-rust-crash-evidence-validator
